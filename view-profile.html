<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Profile - Vibe</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="goodtime-header">
    <div class="header-content">

        <h1>
            <a href="browse.html" style="text-decoration: none; color: inherit;">
            GoodTime
        </a>
        </h1>

        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

    </div>
</header>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<aside class="goodtime-sidebar" id="goodtime-sidebar">

    <div class="sidebar-header">
        <h2>GoodTime</h2>

        <button
            class="sidebar-close"
            id="sidebar-close"
            type="button"
            aria-label="Close menu"
        >
            ×
        </button>
    </div>

    <nav class="sidebar-nav">


        <a href="browse.html">
            🏠 Home
        </a>

        <a href="messages.html">
            💬 Messages
        </a>

        <a href="profile.html">
            👤 My Profile
        </a>

        <button
            class="sidebar-logout"
            id="logout-button"
            type="button"
        >
            🚪 Logout
        </button>

    </nav>

</aside>

    <main class="view-profile-main">

        <section class="view-profile-container">

            <h2 id="view-profile-name">Loading profile...</h2>

            <div id="view-profile-details">
                <!-- Profile information will appear here -->
            </div>

            <a id="message-profile-button" class="btn">
                💬 Message
            </a>

            <br><br>

            <a href="browse.html">
                ← Back to Browse
            </a>

        </section>

    </main>
    <!-- Fullscreen Image Viewer -->
<div id="image-modal" class="image-modal">
    <span id="close-image-modal" class="close-image-modal">&times;</span>
    <img id="modal-profile-image" src="" alt="Profile Picture">
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/app.js"></script>

</body>

</html>
