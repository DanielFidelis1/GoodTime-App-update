<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Profile - Vibe</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>GoodTime</h1>

        <nav>
            <a href="browse.html">Browse</a>
            <a href="messages.html">Messages</a>
            <a href="profile.html">My Profile</a>
            <button id="logout-button">Logout</button>
        </nav>
    </header>


    <main class="view-profile-main">

        <section class="view-profile-container">

            <h2 id="view-profile-name">Loading profile...</h2>

            <div id="view-profile-details">
                <!-- Profile information will appear here -->
            </div>

            <a id="message-profile-button" class="btn">
                💬 Message
            </a>

            <br><br>

            <a href="browse.html">
                ← Back to Browse
            </a>

        </section>

    </main>
    <!-- Fullscreen Image Viewer -->
<div id="image-modal" class="image-modal">
    <span id="close-image-modal" class="close-image-modal">&times;</span>
    <img id="modal-profile-image" src="" alt="Profile Picture">
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/app.js"></script>

</body>

</html>
