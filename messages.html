<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>Messages - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="goodtime-header">
    <div class="header-content">
        
        <h2>
            <a href="browse.html" style="text-decoration: none; color: inherit;">
            GoodTime
        </a>
        </h2>

        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

    </div>
</header>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<aside class="goodtime-sidebar" id="goodtime-sidebar">

    <div class="sidebar-header">
        <h2>GoodTime</h2>

        <button
            class="sidebar-close"
            id="sidebar-close"
            type="button"
            aria-label="Close menu"
        >
            ×
        </button>
    </div>

    <nav class="sidebar-nav">

        <a href="browse.html">
            🏠 Home
        </a>

        <a href="messages.html">
            💬 Messages
        </a>

        <a href="profile.html">
            👤 My Profile
        </a>
        <div class="theme-section">
            <p class="theme-title">Appearance</p>
            <div class="theme-options">
                <button type="button" class="theme-option" data-theme="light">
                    ☀️ Light
                </button>
                <button type="button" class="theme-option" data-theme="dark">
                    🌙 Dark
                </button>
                <button type="button" class="theme-option" data-theme="system">
                    ⚙️ System
                </button>
            </div>
        </div>

        <button
            class="sidebar-logout"
            id="logout-button"
            type="button"
        >
            🚪 Logout
        </button>

    </nav>

</aside>


    <!-- ================================
         MESSAGES
    ================================= -->

    <main class="messages-main">

        <section class="messages-section">


            <!-- TITLE -->

            <div class="messages-title">

                <div>

                    <span class="messages-label">
                        YOUR INBOX
                    </span>

                    <h2>
                        Messages
                    </h2>

                    <p>
                        Keep the conversation going.
                    </p>

                </div>


                <div class="message-icon">
                    💬
                </div>

            </div>


            <!-- ================================
                 SEARCH
            ================================= -->

            <div class="message-search">

                <span class="message-search-icon">
                    🔍
                </span>

                <input
                    type="text"
                    id="conversation-search"
                    placeholder="Search conversations..."
                    autocomplete="off"
                >

            </div>


            <!-- ================================
                 CONVERSATIONS
            ================================= -->

            <div id="conversations-container">

                <!-- Conversations will appear here -->

            </div>


            <!-- ================================
                 EMPTY STATE
            ================================= -->

            <div
                id="empty-conversations"
                class="empty-conversations"
            >

                <div class="empty-message-icon">
                    💬
                </div>

                <h3>
                    No conversations yet
                </h3>

                <p>
                    Start connecting with people on
                    GoodTime and your conversations
                    will appear here.
                </p>


            </div>


        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
