<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>Messages - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="goodtime-header">

        <div class="header-content">

            <h1>CHAT</h1>

            <nav>

                <a href="browse.html">
                    🏠HOME
                </a>

                <a href="profile.html">
                    👤MY PROFILE
                </a>

                <button id="logout-button">
                    Logout
                </button>

            </nav>

        </div>

    </header>


    <!-- ================================
         MESSAGES
    ================================= -->

    <main class="messages-main">

        <section class="messages-section">


            <!-- TITLE -->

            <div class="messages-title">

                <div>

                    <span class="messages-label">
                        YOUR INBOX
                    </span>

                    <h2>
                        Messages
                    </h2>

                    <p>
                        Keep the conversation going.
                    </p>

                </div>


                <div class="message-icon">
                    💬
                </div>

            </div>


            <!-- ================================
                 SEARCH
            ================================= -->

            <div class="message-search">

                <span class="message-search-icon">
                    🔍
                </span>

                <input
                    type="text"
                    id="conversation-search"
                    placeholder="Search conversations..."
                    autocomplete="off"
                >

            </div>


            <!-- ================================
                 CONVERSATIONS
            ================================= -->

            <div id="conversations-container">

                <!-- Conversations will appear here -->

            </div>


            <!-- ================================
                 EMPTY STATE
            ================================= -->

            <div
                id="empty-conversations"
                class="empty-conversations"
            >

                <div class="empty-message-icon">
                    💬
                </div>

                <h3>
                    No conversations yet
                </h3>

                <p>
                    Start connecting with people on
                    GoodTime and your conversations
                    will appear here.
                </p>

                <a
                    href="browse.html"
                    class="start-chat-button"
                >
                    Browse Profiles
                </a>

            </div>


        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
