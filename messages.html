<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>Messages - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="goodtime-header">
    <div class="header-content">
        
        <h2>
            <a href="browse.html" style="text-decoration: none; color: inherit;">
            GoodTime
        </a>
        </h2>

        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

    </div>
</header>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<aside class="goodtime-sidebar" id="goodtime-sidebar">

    <div class="sidebar-header">
        <h2>GoodTime</h2>

        <button
            class="sidebar-close"
            id="sidebar-close"
            type="button"
            aria-label="Close menu"
        >
            ×
        </button>
    </div>

    <nav class="sidebar-nav">

        <a href="browse.html">
            🏠HOME
        </a>

        <a href="view-my-profile.html">
            👤MY PROFILE
        </a>
                <a href="settings.html">
            ⚙️SETTINGS
        </a>
        <div class="theme-section">
            <p class="theme-title">Appearance</p>
            <div class="theme-options">
                <button type="button" class="theme-option" data-theme="light">
                    ☀️Light
                </button>
                <button type="button" class="theme-option" data-theme="dark">
                    🌙Dark
                </button>
                <button type="button" class="theme-option" data-theme="system">
                    ⚙️System mode
                </button>
            </div>
        </div>

        <button
            class="sidebar-logout"
            id="logout-button"
            type="button"
        >
            🚪 Logout
        </button>

    </nav>

</aside>


    <!-- ================================
         MESSAGES
    ================================= -->

    <main class="messages-main">

        <section class="messages-section">


            <!-- TITLE -->

            <div class="messages-title">

                <div>

                    <span class="messages-label">
                        YOUR INBOX
                    </span>

                    <div class="messages-title-row">
                        <div>
                            <h2>Messages</h2>
                            <p>Stay connected with your conversations.</p>
                        </div>
                    </div>
                </div>
                <a
                href="browse.html"
                class="messages-new-chat-button"
                >
                + New Chat
            </a>
        </div>
        <div class="messages-search-wrapper">
    <span class="messages-search-icon">🔍</span>

    <input
        type="text"
        id="conversation-search"
        class="conversation-search"
        placeholder="Search conversations..."
        autocomplete="off"
    >
</div>

                </div>


                <div class="message-icon">
                    💬
                </div>

            </div>




            <!-- ================================
                 CONVERSATIONS
            ================================= -->

            <div id="conversations-container">

                <!-- Conversations will appear here -->

            </div>

        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
