<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>My Profile - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="goodtime-header">

        <div class="header-content">

            <h1>
                <a
                    href="browse.html"
                    style="text-decoration: none; color: inherit;"
                >
                    GoodTime
                </a>
            </h1>

            <button
                class="menu-button"
                id="menu-button"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- ================================
         SIDEBAR
    ================================= -->

    <div
        class="sidebar-overlay"
        id="sidebar-overlay"
    ></div>

    <aside
        class="goodtime-sidebar"
        id="goodtime-sidebar"
    >

        <div class="sidebar-header">

            <h2>GoodTime</h2>

            <button
                class="sidebar-close"
                id="sidebar-close"
                type="button"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>


        <nav class="sidebar-nav">

            <a href="browse.html">
                🏠 HOME
            </a>

            <a
                href="messages.html"
                class="messages-sidebar-link"
            >
                💬 MESSAGES

                <span
                    id="sidebar-unread-count"
                    class="sidebar-unread-count"
                ></span>

            </a>

            <a href="view-my-profile.html">
                👤 MY PROFILE
            </a>

            <a href="settings.html">
                ⚙️ SETTINGS
            </a>


            <div class="theme-section">

                <p class="theme-title">
                    Appearance
                </p>

                <div class="theme-options">

                    <button
                        type="button"
                        class="theme-option"
                        data-theme="light"
                    >
                        ☀️ Light
                    </button>

                    <button
                        type="button"
                        class="theme-option"
                        data-theme="dark"
                    >
                        🌙 Dark
                    </button>

                    <button
                        type="button"
                        class="theme-option"
                        data-theme="system"
                    >
                        ⚙️ System mode
                    </button>

                </div>

            </div>


            <button
                class="sidebar-logout"
                id="logout-button"
                type="button"
            >
                🚪 Logout
            </button>

        </nav>

    </aside>


    <!-- ================================
         MY PROFILE
    ================================= -->

    <main class="profile-page">

        <section class="profile-editor">


            <!-- TITLE -->

            <div class="profile-editor-heading">

                <span class="profile-label">
                    MY PROFILE
                </span>

                <h2 id="my-profile-title">
                    My Profile
                </h2>

                <p>
                    This is how your profile appears to other people.
                </p>

            </div>


            <!-- ================================
                 MAIN PROFILE PHOTO
            ================================= -->

            <div class="view-profile-main-photo-wrapper">

                <img
                    id="my-profile-picture"
                    class="view-profile-picture"
                    src=""
                    alt="My profile picture"
                >

            </div>


            <!-- ================================
                 ADDITIONAL PHOTOS
            ================================= -->

            <div
                id="my-profile-gallery"
                class="view-profile-gallery"
            >

                <h3 class="view-profile-gallery-title">
                    More photos
                </h3>

                <div
                    id="my-profile-gallery-grid"
                    class="view-profile-gallery-grid"
                ></div>

            </div>


            <!-- ================================
                 PROFILE INFORMATION
            ================================= -->

            <div class="view-profile-info">

                <div
                    id="my-profile-activity"
                    class="profile-activity-status"
                >
                    <span class="activity-dot"></span>

                    <span id="my-profile-activity-text">
                        Loading...
                    </span>
                </div>


                <div class="form-group">

                    <label>
                        Name
                    </label>

                    <div
                        id="my-profile-name"
                        class="profile-view-value"
                    >
                        Loading...
                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Age
                    </label>

                    <div
                        id="my-profile-age"
                        class="profile-view-value"
                    >
                        —
                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Gender
                    </label>

                    <div
                        id="my-profile-gender"
                        class="profile-view-value"
                    >
                        —
                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <div
                        id="my-profile-location"
                        class="profile-view-value"
                    >
                        —
                    </div>

                </div>


                <div class="form-group">

                    <label>
                        About Me
                    </label>

                    <div
                        id="my-profile-bio"
                        class="profile-view-value profile-view-bio"
                    >
                        —
                    </div>

                </div>

            </div>


            <!-- ================================
                 EDIT PROFILE
            ================================= -->

            <div class="profile-view-actions">

                <a
                    href="profile.html"
                    class="btn"
                >
                    ✏️ Edit Profile
                </a>

            </div>


            <!-- BACK -->

            <div class="profile-back">

                <a href="browse.html">
                    ← Back to Browse
                </a>

            </div>


        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
