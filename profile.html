<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Create Profile - Vibe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <body>

    <header>
        <h1>GoodTime</h1>

        <nav>
            <a href="browse.html">Browse</a>
            <a href="messages.html">Messages</a>
            <a href="index.html">Home</a>
            <button id="logout-button">Logout</button>
        </nav>
    </header>

    <main>
    <main>
        <section class="auth-container profile-container">
            <h1>Create Your Profile</h1>
            <p>Tell people a little about yourself.</p>
            <div class="profile-picture-section">
                <label for="profile-picture">Profile Picture</label>
                <div id="current-profile-picture"></div>
                <input
                type="file"
                id="profile-picture"
                accept="image/*"
                >
            </div>
            
            <form id="profile-form">
                <label for="profile-name">Name</label>
                <input
                    type="text"
                    id="profile-name"
                    placeholder="Enter your name"
                    required
                >
                <label for="profile-age">Age</label>
                <input
                    type="number"
                    id="profile-age"
                    placeholder="Enter your age"
                    min="18"
                    required
                >
                <label for="profile-gender">Gender</label>
                <select id="profile-gender" required>
                    <option value="">Select your gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <label for="profile-location">Location</label>
                <input
                    type="text"
                    id="profile-location"
                    placeholder="e.g. Abuja"
                    required
                >
                <label for="profile-bio">Bio</label>
                <textarea
                id="profile-bio"
                placeholder="Tell people something about yourself..."
                rows="5"
                maxlength="300"
                required>
            </textarea>

<small id="bio-counter">0 / 300</small>
                <button type="submit" class="btn">
                    Save Profile
                </button>
                <a href="browse.html" class="cancel-button">
                    Cancel
                </a>
            </form>
            <p class="auth-link">
    <a href="browse.html">← Back to Browse</a>
</p>

<p class="auth-link">
    <a href="messages.html">💬 Messages</a>
</p>

<p class="auth-link">
    <a href="index.html">← Back to Home</a>
</p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
</body>
</html>
