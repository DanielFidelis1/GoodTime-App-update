<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="manifest" href="manifest.json">

    <title>My Profile - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="goodtime-header">
    <div class="header-content">

        <h1>
            <a href="browse.html" style="text-decoration: none; color: inherit;">
            GoodTime
        </a>
        </h1>

        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

    </div>
</header>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<aside class="goodtime-sidebar" id="goodtime-sidebar">

    <div class="sidebar-header">
        <h2>GoodTime</h2>

        <button
            class="sidebar-close"
            id="sidebar-close"
            type="button"
            aria-label="Close menu"
        >
            ×
        </button>
    </div>

    <nav class="sidebar-nav">


        <a href="browse.html">
            🏠 Home
        </a>

        <a href="messages.html">
            💬 Messages
        </a>

        <a href="profile.html">
            👤 My Profile
        </a>

        <button
            class="sidebar-logout"
            id="logout-button"
            type="button"
        >
            🚪 Logout
        </button>

    </nav>

</aside>

    <!-- ================================
         PROFILE
    ================================= -->

    <main class="profile-page">

        <section class="profile-editor">


            <!-- TITLE -->

            <div class="profile-editor-heading">

                <span class="profile-label">
                    YOUR PROFILE
                </span>

                <h2>
                    Create your profile
                </h2>

                <p>
                    Tell people a little about yourself.
                </p>

            </div>


            <!-- ================================
                 PROFILE PICTURE
            ================================= -->

            <div class="profile-picture-section">

                <div class="section-heading">

                    <h3>
                        Choose your picture
                    </h3>

                    <p>
                        Pick the avatar that represents you.
                    </p>

                </div>


                <div class="avatar-grid">

                    <div
                        class="avatar-option"
                        data-avatar="avatar1"
                    >
                        <img
                            src="images/avatars/avatar1.png"
                            alt="Male avatar 1"
                        >
                    </div>


                    <div
                        class="avatar-option"
                        data-avatar="avatar2"
                    >
                        <img
                            src="images/avatars/avatar2.png"
                            alt="Male avatar 2"
                        >
                    </div>


                    <div
                        class="avatar-option"
                        data-avatar="avatar3"
                    >
                        <img
                            src="images/avatars/avatar3.png"
                            alt="Male avatar 3"
                        >
                    </div>


                    <div
                        class="avatar-option"
                        data-avatar="avatar4"
                    >
                        <img
                            src="images/avatars/avatar4.png"
                            alt="Male avatar 4"
                        >
                    </div>


                    <div
                        class="avatar-option"
                        data-avatar="avatar5"
                    >
                        <img
                            src="images/avatars/avatar5.png"
                            alt="Male avatar 5"
                        >
                    </div>


                    <div
                        class="avatar-option"
                        data-avatar="avatar6"
                    >
                        <img
                            src="images/avatars/avatar6.png"
                            alt="Female avatar 1"
                        >
                    </div>


                    <div
                        class="avatar-option"
                        data-avatar="avatar7"
                    >
                        <img
                            src="images/avatars/avatar7.png"
                            alt="Female avatar 2"
                        >
                    </div>


                    <div
                        class="avatar-option"
                        data-avatar="avatar8"
                    >
                        <img
                            src="images/avatars/avatar8.png"
                            alt="Female avatar 3"
                        >
                    </div>


                    <div
                        class="avatar-option"
                        data-avatar="avatar9"
                    >
                        <img
                            src="images/avatars/avatar9.png"
                            alt="Female avatar 4"
                        >
                    </div>


                    <div
                        class="avatar-option"
                        data-avatar="avatar10"
                    >
                        <img
                            src="images/avatars/avatar10.png"
                            alt="Female avatar 5"
                        >
                    </div>

                </div>


                <input
                    type="hidden"
                    id="selected-avatar"
                >

            </div>


            <!-- ================================
                 PROFILE INFORMATION
            ================================= -->

            <form id="profile-form">


                <div class="form-group">

                    <label for="profile-name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="profile-name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="profile-age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="profile-age"
                        placeholder="Enter your age"
                        min="18"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="profile-gender">
                        Gender
                    </label>

                    <select
                        id="profile-gender"
                        required
                    >

                        <option value="">
                            Select your gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="profile-location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="profile-location"
                        placeholder="e.g. Abuja"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="profile-bio">
                        About you
                    </label>

                    <textarea
                        id="profile-bio"
                        placeholder="Tell people something about yourself..."
                        rows="5"
                        maxlength="300"
                        required
                    ></textarea>

                    <small id="bio-counter">
                        0 / 300
                    </small>

                </div>


                <!-- SAVE -->

                <button
                    type="submit"
                    class="btn profile-save-button"
                >
                    Save Profile
                </button>


                <!-- CANCEL -->

                <a
                    href="browse.html"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </form>


            <!-- BACK -->

            <div class="profile-back">

                <a href="browse.html">
                    ← Back to Browse
                </a>

            </div>


        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
