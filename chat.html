<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>Chat - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="goodtime-header">

        <div class="header-content">

            <h1>GoodTime</h1>

            <nav>

                <a href="browse.html">
                    🏠HOME
                </a>

                <a
                    href="messages.html"
                    class="messages-nav-link"
                >
                    💬MESSAGES
                    <span
                        id="unread-badge"
                        class="unread-badge"
                    >
                        0
                    </span>
                </a>

                <a href="profile.html">
                    👤MY PROFILE
                </a>

            </nav>

        </div>

    </header>


    <!-- ================================
         CHAT
    ================================= -->

    <main class="chat-main">

        <section class="chat-container">


            <!-- CHAT HEADER -->

            <div class="chat-header">

                <a
                    href="messages.html"
                    class="chat-back-button"
                >
                    ←
                </a>


                <div class="chat-user-info">


                    <!-- USER AVATAR -->

                    <div
                        id="chat-user-avatar"
                        class="chat-user-avatar"
                    >
                        👤
                    </div>


                    <div>

                        <span class="chat-label">
                            CONVERSATION
                        </span>

                        <h2 id="chat-name">
                            Chat
                        </h2>

                    </div>


                </div>

            </div>


            <!-- ================================
                 MESSAGES
            ================================= -->

            <div id="messages-container"></div>

            <div id="typing-indicator"></div>


            <!-- ================================
                 MESSAGE INPUT
            ================================= -->

            <form id="message-form">

                <input
                    type="text"
                    id="message-input"
                    placeholder="Type a message..."
                    autocomplete="off"
                    required
                >

                <button
                    type="submit"
                    class="btn"
                >
                    Send
                </button>

            </form>


        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
