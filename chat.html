<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>Chat - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="goodtime-header">
    <div class="header-content">

        <h1>
            <a href="browse.html" style="text-decoration: none; color: inherit;">
            GoodTime
        </a>
        </h1>

        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

    </div>
</header>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<aside class="goodtime-sidebar" id="goodtime-sidebar">

    <div class="sidebar-header">
        <h2>GoodTime</h2>

        <button
            class="sidebar-close"
            id="sidebar-close"
            type="button"
            aria-label="Close menu"
        >
            ×
        </button>
    </div>

    <nav class="sidebar-nav">

        <a href="browse.html">
            🏠HOME
        </a>

        <a href="messages.html" class="messages-sidebar-link">
            💬MESSAGES
            <span id="sidebar-unread-count" class="sidebar-unread-count"></span>
        </a>

        <a href="view-my-profile.htmll">
            👤MY PROFILE
        </a>
        <a href="settings.html">
            ⚙️SETTINGS
        </a>
            <div class="theme-section">
    <p class="theme-title">Appearance</p>

    <div class="theme-options">
        <button type="button" class="theme-option" data-theme="light">
            ☀️Light
        </button>

        <button type="button" class="theme-option" data-theme="dark">
            🌙Dark
        </button>

        <button type="button" class="theme-option" data-theme="system">
            ⚙️System mode
        </button>
    </div>
</div>

        <button
            class="sidebar-logout"
            id="logout-button"
            type="button"
        >
            🚪 Logout
        </button>

    </nav>

</aside>


    <!-- ================================
         CHAT
    ================================= -->

    <!-- ================================
     CHAT
================================= -->

<main class="chat-main">

    <section class="chat-container">

        <!-- CHAT HEADER -->
        <div class="chat-header">

            <a
                href="messages.html"
                class="chat-back-button"
            >
                ←
            </a>

            <div class="chat-user-info">

                <!-- USER AVATAR -->
                <div
                    id="chat-user-avatar"
                    class="chat-user-avatar"
                >
                    👤
                </div>

                <div class="chat-user-details">

                    <span class="chat-label">
                        CONVERSATION
                    </span>

                    <div class="chat-user-heading">

                        <h2 id="chat-user-name">
                            Loading...
                        </h2>

                        <div
                            id="chat-user-status"
                            class="chat-user-status"
                        >
                            <span class="chat-status-dot"></span>

                            <span id="chat-user-status-text">
                                Offline
                            </span>
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- ================================
             MESSAGES
        ================================= -->

        <div id="messages-container"></div>

        <div id="typing-indicator"></div>


        <!-- ================================
             MESSAGE INPUT
        ================================= -->

        <form id="message-form">

            <input
                type="text"
                id="message-input"
                placeholder="Type a message..."
                autocomplete="off"
                required
            >

            <button
                type="submit"
                class="btn"
            >
                Send
            </button>

        </form>

    </section>

</main>

            <!-- ================================
                 MESSAGES
            ================================= -->

            <div id="messages-container"></div>

            <div id="typing-indicator"></div>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
