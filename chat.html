<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>Chat - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="goodtime-header">
    <div class="header-content">

        <h1>
            <a href="browse.html" style="text-decoration: none; color: inherit;">
            GoodTime
        </a>
        </h1>

        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

    </div>
</header>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<aside class="goodtime-sidebar" id="goodtime-sidebar">

    <div class="sidebar-header">
        <h2>GoodTime</h2>

        <button
            class="sidebar-close"
            id="sidebar-close"
            type="button"
            aria-label="Close menu"
        >
            ×
        </button>
    </div>

    <nav class="sidebar-nav">

        <a href="browse.html">
            🏠 Home
        </a>

        <a href="messages.html">
            💬 Messages
        </a>

        <a href="profile.html">
            👤 My Profile
        </a>

        <button
            class="sidebar-logout"
            id="logout-button"
            type="button"
        >
            🚪 Logout
        </button>

    </nav>

</aside>


    <!-- ================================
         CHAT
    ================================= -->

    <main class="chat-main">

        <section class="chat-container">


            <!-- CHAT HEADER -->

            <div class="chat-header">

                <a
                    href="messages.html"
                    class="chat-back-button"
                >
                    ←
                </a>


                <div class="chat-user-info">


                    <!-- USER AVATAR -->

                    <div
                        id="chat-user-avatar"
                        class="chat-user-avatar"
                    >
                        👤
                    </div>


                    <div>

                        <span class="chat-label">
                            CONVERSATION
                        </span>

                        <h2 id="chat-name">
                            Chat
                        </h2>

                    </div>


                </div>

            </div>


            <!-- ================================
                 MESSAGES
            ================================= -->

            <div id="messages-container"></div>

            <div id="typing-indicator"></div>


            <!-- ================================
                 MESSAGE INPUT
            ================================= -->

            <form id="message-form">

                <input
                    type="text"
                    id="message-input"
                    placeholder="Type a message..."
                    autocomplete="off"
                    required
                >

                <button
                    type="submit"
                    class="btn"
                >
                    Send
                </button>

            </form>


        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
