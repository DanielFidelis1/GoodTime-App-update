<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="manifest" href="manifest.json">

    <title>Browse Profiles - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="goodtime-header">

        <div class="header-content">

            <h1>GoodTime</h1>

            <nav>

                <a href="messages.html" class="messages-nav-link">
                    💬MESSAGES
                    <span id="unread-badge" class="unread-badge">0</span>
                </a>

                <a href="profile.html">
                    👤MY PROFILE
                </a>

                <button id="logout-button">
                    Logout
                </button>

            </nav>

        </div>

    </header>


    <!-- ================================
         BROWSE PAGE
    ================================= -->

    <main class="browse-main">

        <section class="browse-section">


            <!-- PAGE TITLE -->

            <div class="browse-heading">

                <span class="browse-label">
                    DISCOVER
                </span>

                <h2>
                    Find your people
                </h2>

                <p>
                    Browse profiles and connect
                    with new people.
                </p>

            </div>


            <!-- ================================
                 WELCOME MESSAGE
            ================================= -->

            <div
                id="welcome-message"
                class="welcome-message"
            >

                <p class="welcome-title">
                    Welcome back,
                    <strong id="welcome-name">
                        there
                    </strong>
                    👋
                </p>

                <p id="profile-status"></p>

                <p class="welcome-subtitle">
                    Your GoodTime journey continues.
                </p>

            </div>


            <!-- ================================
                 SEARCH & FILTERS
            ================================= -->

            <div class="browse-controls">

                <div class="search-box">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="search-input"
                        placeholder="Search by name or location..."
                    >

                </div>


                <div class="filter-row">

                    <div class="age-filter">

                        <input
                            type="number"
                            id="min-age"
                            placeholder="Min age"
                            min="18"
                        >

                        <span>–</span>

                        <input
                            type="number"
                            id="max-age"
                            placeholder="Max age"
                            min="18"
                        >

                    </div>


                    <select id="gender-filter">

                        <option value="">
                            All genders
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <button
                        type="button"
                        id="clear-search"
                    >
                        Clear
                    </button>

                </div>

            </div>


            <!-- ================================
                 PROFILES
            ================================= -->

            <div
                id="profiles-container"
                class="profiles-grid"
            >
                <!-- Profiles will appear here -->
            </div>


        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
