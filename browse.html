<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="manifest" href="manifest.json">

    <title>Browse Profiles - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="goodtime-header">
    <div class="header-content">

        <h1>
            <a href="browse.html" style="text-decoration: none; color: inherit;">
            GoodTime
        </a>
        </h1>

        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

    </div>
</header>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<aside class="goodtime-sidebar" id="goodtime-sidebar">

    <div class="sidebar-header">
        <h2>GoodTime</h2>

        <button
            class="sidebar-close"
            id="sidebar-close"
            type="button"
            aria-label="Close menu"
        >
            ×
        </button>
    </div>

    <nav class="sidebar-nav">

        <a href="browse.html">
            🏠 Home
        </a>

        <a href="messages.html">
            💬 Messages
        </a>

        <a href="profile.html">
            👤 My Profile
        </a>

        <button
            class="sidebar-logout"
            id="logout-button"
            type="button"
        >
            🚪 Logout
        </button>

    </nav>

</aside>

    <!-- ================================
         BROWSE PAGE
    ================================= -->

    <main class="browse-main">

        <section class="browse-section">


            <!-- PAGE TITLE -->

            <div class="browse-heading">

                <span class="browse-label">
                    DISCOVER
                </span>

                <h2>
                    Find your people
                </h2>

                <p>
                    Browse profiles and connect
                    with new people.
                </p>

            </div>


            <!-- ================================
                 WELCOME MESSAGE
            ================================= -->

            <div
                id="welcome-message"
                class="welcome-message"
            >

                <p class="welcome-title">
                    Welcome back,
                    <strong id="welcome-name">
                        there
                    </strong>
                    👋
                </p>

                <p id="profile-status"></p>

                <p class="welcome-subtitle">
                    Your GoodTime journey continues.
                </p>

            </div>


            <!-- ================================
                 SEARCH & FILTERS
            ================================= -->

            <div class="browse-controls">

                <div class="search-box">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="search-input"
                        placeholder="Search by name or location..."
                    >

                </div>


                <div class="filter-row">

                    <div class="age-filter">

                        <input
                            type="number"
                            id="min-age"
                            placeholder="Min age"
                            min="18"
                        >

                        <span>–</span>

                        <input
                            type="number"
                            id="max-age"
                            placeholder="Max age"
                            min="18"
                        >

                    </div>


                    <select id="gender-filter">

                        <option value="">
                            All genders
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <button
                        type="button"
                        id="clear-search"
                    >
                        Clear
                    </button>

                </div>

            </div>


            <!-- ================================
                 PROFILES
            ================================= -->

            <div
                id="profiles-container"
                class="profiles-grid"
            >
                <!-- Profiles will appear here -->
            </div>


        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
