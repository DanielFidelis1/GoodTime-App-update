<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>Reset Password - GoodTime</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="auth-page">


    <!-- HEADER -->

    <header class="auth-header">

        <a
            href="index.html"
            class="auth-logo"
        >
            GoodTime
        </a>

    </header>


    <!-- RESET PASSWORD -->

    <main class="auth-main">

        <section class="auth-card">


            <div class="auth-card-top">

                <span class="auth-label">
                    ACCOUNT SECURITY
                </span>

                <h1>
                    Reset Password
                </h1>

                <p>
                    Create a new password for your
                    GoodTime account.
                </p>

            </div>


            <form id="reset-password-form">


                <div class="auth-field">

                    <label for="new-password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new-password"
                        placeholder="Enter your new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Update Password
                </button>


            </form>


            <a
                href="login.html"
                class="auth-back"
            >
                ← Back to Login
            </a>


        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- GOODTIME JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
